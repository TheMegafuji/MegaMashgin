# API custom-domain reference. Keep the ACME webroot available for renewal.
# The production vhost proxies to the existing Caddy/API listener only.
server {
    listen 80;
    listen [::]:80;
    server_name api.megamashgin.top;
    client_max_body_size 32k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.megamashgin.top;
    ssl_certificate /etc/letsencrypt/live/api.megamashgin.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.megamashgin.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_cache off;
    }
}
